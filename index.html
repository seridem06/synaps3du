<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Misty · tu gata guía</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-modo="tutor">
  <div id="toasts" aria-live="polite"></div>

  <!-- ============ REGISTRO DE ENTRADA ============ -->
  <section id="registro" class="screen hidden">
    <div class="reg-card">
      <div class="reg-banner"><img src="assets/misty-referencia.jpg" alt="Misty, la gata guía"></div>
      <div id="regCat" class="reg-cat"><img src="assets/misty-avatar.png" alt=""></div>
      <h1>¡Hola! Soy Misty</h1>
      <p class="reg-sub">Te acompaño en tu paso a secundaria. Cuéntame quién eres.</p>
      <form id="regForm" autocomplete="off">
        <label><span class="lab">Tu nombre</span>
          <input id="regNombre" required maxlength="40" placeholder="Ej: Lucía"></label>
        <label><span class="lab">Tu colegio</span>
          <input id="regColegio" required maxlength="80" placeholder="Ej: I.E. San Agustín"></label>
        <label><span class="lab">Tu grado</span>
          <select id="regGrado">
            <option value="5.° grado">5.° grado</option>
            <option value="6.° grado">6.° grado</option>
          </select></label>
        <label><span class="lab">Clave de IA: OpenRouter o Gemini <small>(opcional ahora; la puedes poner luego en Configuración)</small></span>
          <input id="regKey" type="password" placeholder="sk-or-... o AQ...."></label>
        <button class="btn primary big" type="submit">Empezar</button>
      </form>
      <p class="fine">Tus datos se quedan solo en este navegador.</p>
    </div>
  </section>

  <!-- ============ APP ============ -->
  <div id="app" class="hidden">
    <aside id="sidebar">
      <div class="brand"><img class="brand-img" src="assets/misty-avatar.png" alt=""><span>Misty</span></div>
      <div class="perfil-mini">
        <img class="perfil-img" src="assets/misty-avatar.png" alt="">
        <b id="sbNombre"></b>
        <small id="sbGrado"></small>
      </div>
      <nav>
        <p class="nav-tit">Aprendizaje</p>
        <button data-vista="inicio"><span>🏠</span>Inicio</button>
        <button data-vista="guia"><span>🧭</span>Mi ruta</button>
        <button data-vista="tutor"><span>💬</span>Tutor</button>
        <button data-panel="logros"><span>🏆</span>Logros</button>
        <button data-panel="areas"><span>📚</span>Áreas</button>
        <button data-panel="mapa"><span>🕸️</span>Mapa de progreso</button>
        <p class="nav-tit">Cuenta</p>
        <button data-panel="perfil"><span>👤</span>Perfil</button>
        <button data-panel="accesorios"><span>🧢</span>Accesorios</button>
        <button data-panel="reporte"><span>📄</span>Reporte</button>
        <button data-panel="config"><span>⚙️</span>Configuración</button>
      </nav>
    </aside>

    <main id="main">
      <section id="stage">
        <svg id="escena" viewBox="0 0 400 600" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
          <defs>
            <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fbdf2"/><stop offset=".65" stop-color="#cfe8fb"/><stop offset="1" stop-color="#f4f9ff"/></linearGradient>
            <linearGradient id="volcan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a9cc2"/><stop offset="1" stop-color="#b7c6e0"/></linearGradient>
          </defs>
          <rect width="400" height="600" fill="url(#cielo)"/>
          <circle cx="330" cy="90" r="34" fill="#fff6c9" opacity=".85"/>
          <g fill="#fff" opacity=".9"><ellipse cx="90" cy="110" rx="46" ry="14"/><ellipse cx="122" cy="100" rx="30" ry="14"/><ellipse cx="300" cy="190" rx="52" ry="13"/><ellipse cx="270" cy="182" rx="26" ry="12"/></g>
          <path d="M-20 400 L70 300 L120 340 L170 290 L230 400Z" fill="#a9bbdb"/>
          <path d="M120 400 L250 205 L300 250 L330 235 L440 400Z" fill="url(#volcan)"/>
          <path d="M250 205 L222 247 L240 242 L252 262 L266 240 L284 250 L300 250Z" fill="#fff"/>
          <path d="M-20 430 Q100 380 220 420 T430 410 L430 600 L-20 600Z" fill="#cfe7c4"/>
          <rect x="0" y="470" width="400" height="130" fill="#f1e6cf"/>
          <g fill="#d9c7a0"><path d="M10 470 v-40 a30 30 0 0 1 60 0 v40z"/><path d="M110 470 v-52 a36 36 0 0 1 72 0 v52z"/><path d="M230 470 v-40 a30 30 0 0 1 60 0 v40z"/><path d="M330 470 v-52 a36 36 0 0 1 72 0 v52z"/></g>
          <g fill="#f8f1e0"><path d="M18 470 v-36 a22 22 0 0 1 44 0 v36z"/><path d="M120 470 v-48 a26 26 0 0 1 52 0 v48z"/><path d="M238 470 v-36 a22 22 0 0 1 44 0 v36z"/><path d="M340 470 v-48 a26 26 0 0 1 52 0 v48z"/></g>
          <rect x="0" y="470" width="400" height="8" fill="#c9b78c"/>
        </svg>
        <div id="stageCat"></div>
        <div id="floatLayer"></div>
      </section>

      <section id="content">
        <header id="topbar">
          <button id="menuBtn" class="icon-btn" aria-label="Menú">☰</button>
          <div id="modoSwitch" role="group" aria-label="Vista">
            <button data-vista="inicio" aria-pressed="true">🏠 Inicio</button>
            <button data-vista="guia" data-modo="guia" aria-pressed="false">🧭 Guía</button>
            <button data-vista="tutor" data-modo="tutor" aria-pressed="false">🎓 Tutor</button>
          </div>
          <div id="hud">
            <span id="hudNivel" class="pill">Nivel 1</span>
            <div class="bar" title="Progreso al siguiente nivel"><div id="hudBarra"></div></div>
            <span id="hudPts" class="hud-pts">0 pts</span>
            <span id="hudRacha" class="pill racha" title="Días seguidos">🔥 0</span>
          </div>
        </header>

        <div id="vistaInicio" class="vista"></div>

        <div id="vistaAprender" class="vista">
          <section id="panel">
            <div id="rutaPanel" class="ruta hidden">
              <div class="ruta-head">
                <select id="rutaSel" aria-label="Mis rutas"></select>
                <span id="rutaArea" class="badge"></span>
              </div>
              <div id="rutaNodos" class="ruta-nodos"></div>
            </div>
            <div id="chatLog" aria-live="polite"></div>
          </section>

          <form id="chatBar" autocomplete="off">
            <div id="fotoPrev" class="foto-prev hidden"></div>
            <div class="bar-row">
              <div class="input-pill">
                <button type="button" id="btnFoto" class="icon-btn flat" title="Subir foto del cuaderno" aria-label="Subir foto">📷</button>
                <input id="fotoInput" type="file" accept="image/*" hidden>
                <input id="chatInput" type="text" maxlength="600" placeholder="Escribe aquí…" aria-label="Mensaje">
                <button type="button" id="btnMic" class="icon-btn flat" title="Hablar" aria-label="Micrófono">🎤</button>
              </div>
              <button type="submit" id="btnEnviar" class="btn primary send" aria-label="Enviar">➤</button>
            </div>
          </form>
        </div>
      </section>
    </main>
  </div>

  <!-- ============ HOJA DE LECCIÓN ============ -->
  <div id="hoja" class="hoja hidden" role="dialog" aria-modal="true" aria-label="Lección">
    <div id="hojaBox" class="hoja-box"></div>
  </div>

  <!-- ============ MODAL ============ -->
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-box">
      <header><h2 id="modalTitle"></h2><button id="modalClose" class="icon-btn flat" aria-label="Cerrar">✕</button></header>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Three.js local (vendor/). Si falta, Misty usa su versión 2D automáticamente. -->
  <script src="vendor/three.min.js"></script>
  <script src="js/curriculum.js"></script>
  <script src="js/cat.js"></script>
  <script src="js/ai.js"></script>
  <script src="js/voice.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
